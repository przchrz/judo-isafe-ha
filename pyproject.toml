[project]
name = "judo-isafe-ha"
version = "0.1.0"
description = "Home Assistant integration for the JUDO ZEWA i-SAFE leakage protection device"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
